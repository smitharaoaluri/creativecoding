<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smitha Aluri — creative coding experiments.">
  <title>Creative Coding — Smitha Aluri</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="https://smitha-aluri.com/">SMITHA</a>
    <nav>
      <a href="https://smitha-aluri.com/">WORK</a>
      <a href="https://smitha-aluri.com/about">ABOUT</a>
    </nav>
  </header>

  <main>
    <section class="intro">
      <p class="eyebrow">CREATIVE CODING</p>
      <h1>Experiments in code, interaction,<br>motion & visual systems.</h1>
    </section>

    <section class="grid" aria-label="Creative coding projects">
      <article class="project-card">
        <button class="project-button" type="button"
          data-sketch="babybreath/"
          data-title="Baby's Breath"
          data-meta="Generative botanical study · p5.js"
          aria-label="Open Baby's Breath interactive sketch">
          <span class="thumb">
            <img src="babybreath/IMG_6192.png" alt="Baby's Breath generative botanical sketch">
          </span>
          <span class="card-info">
            <span>
              <span class="project-title">Baby's Breath</span>
              <span class="project-meta">Generative botanical study · p5.js</span>
            </span>
            <span class="number">01</span>
          </span>
        </button>
      </article>

      <article class="project-card">
  <button class="project-button" type="button"
    data-sketch="annialbers/"
    data-title="Anni Albers"
    data-meta="Generative weaving study · p5.js"
    aria-label="Open Anni Albers interactive sketch">
    <span class="thumb">
      <img src="annialbers/thumbnail.png" alt="Preview of Anni Albers generative sketch">
    </span>
    <span class="card-info">
      <span>
        <span class="project-title">Anni Albers</span>
        <span class="project-meta">Generative weaving study · p5.js</span>
      </span>
      <span class="number">02</span>
    </span>
  </button>
</article>

      <!-- COPY THIS ARTICLE FOR EACH NEW SKETCH
      <article class="project-card">
        <button class="project-button" type="button"
          data-sketch="your-folder/"
          data-title="Project Title"
          data-meta="Description · p5.js">
          <span class="thumb">
            <img src="your-folder/thumbnail.png" alt="">
          </span>
          <span class="card-info">
            <span>
              <span class="project-title">Project Title</span>
              <span class="project-meta">Description · p5.js</span>
            </span>
            <span class="number">02</span>
          </span>
        </button>
      </article>
      -->
    </section>
  </main>

  <div class="modal" id="sketchModal" aria-hidden="true">
    <div class="modal-backdrop" data-close="true"></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div>
          <p class="modal-kicker">INTERACTIVE SKETCH</p>
          <h2 id="modalTitle">Baby's Breath</h2>
        </div>
        <div class="modal-actions">
          <a id="openSketch" href="#" target="_blank" rel="noopener">OPEN ↗</a>
          <button id="closeModal" type="button" aria-label="Close sketch">CLOSE ×</button>
        </div>
      </div>
      <div class="sketch-frame">
        <iframe id="sketchFrame" title="Interactive p5.js sketch" src="about:blank"></iframe>
      </div>
    </section>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
